name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install local package
        run: python -m pip install -e .
      - name: Unit and preservation checks
        run: python -m unittest discover -s tests -v
      - name: Frozen benchmark checks
        run: python -m unittest benchmarks.test_benchmarks -v
      - name: Check documentation targets and frozen evidence hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          files = [Path('README.md'), Path('CONTRIBUTING.md'), Path('CHANGELOG.md'), *Path('docs').glob('*.md')]
          failures = []
          for file in files:
              text = file.read_text()
              targets = re.findall(r'\[[^\]]*\]\(([^)]+)\)', text)
              targets += re.findall(r'(?:src|href)="([^"]+)"', text)
              for target in targets:
                  if target.startswith(('https://', 'http://', '#', 'mailto:')):
                      continue
                  target = target.split('#', 1)[0]
                  if target and not (file.parent / target).exists():
                      failures.append(f'{file}: {target}')
          evidence = Path('benchmarks/results-v2')
          manifest = json.loads((evidence / 'artifact-manifest.json').read_text())
          for name, row in manifest['files'].items():
              if hashlib.sha256((evidence / name).read_bytes()).hexdigest() != row['sha256']:
                  failures.append(f'Frozen evidence changed: {name}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print('Documentation targets and frozen evidence hashes passed')
          PY
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir "${{ runner.temp }}/forksense-wheels" .
      - name: Install wheel in an isolated environment and run demo plus acceptance
        working-directory: ${{ runner.temp }}
        env:
          FORKSENSE_SMOKE_ROOT: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, sys, venv
          root = Path(os.environ['FORKSENSE_SMOKE_ROOT'])
          environment = root / 'forksense-wheel-env'
          venv.EnvBuilder(with_pip=True).create(environment)
          python = environment / 'bin' / 'python'
          wheels = list((root / 'forksense-wheels').glob('forksense-*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([str(python), '-m', 'pip', 'install', '--no-deps', str(wheels[0])], check=True)
          subprocess.run([str(python), '-m', 'forksense', 'doctor'], check=True)
          output = root / 'forksense-wheel-demo'
          subprocess.run([str(python), '-m', 'forksense', 'demo', '--output', str(output)], check=True)
          report = json.loads((output / 'run' / 'report.json').read_text())
          assert report['status'] == 'verified'
          repo = output / 'checkout'
          before_head = subprocess.check_output(['git', '-C', str(repo), 'rev-parse', 'HEAD'])
          assert not subprocess.check_output(['git', '-C', str(repo), 'status', '--porcelain'])
          subprocess.run([str(python), '-m', 'forksense', 'accept', str(output / 'run' / 'report.json'), '--repo', str(repo), '--yes'], check=True)
          assert subprocess.check_output(['git', '-C', str(repo), 'rev-parse', 'HEAD']) == before_head
          subprocess.run(report['plan']['verify'], cwd=repo, check=True)
          print('Isolated wheel, prepared demo, explicit acceptance and independent tests passed')
          PY
