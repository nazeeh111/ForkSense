<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc"><title id="title">How ForkSense turns uncertainty into a verified candidate</title><desc id="desc">Observe a baseline, identify hypotheses, choose a diagnostic probe using a policy, and update evidence. Repeat probes while informative and affordable. Repair in an isolated worktree, verify in a fresh worktree with protected tests, and return a patch for explicit manual acceptance. Inconclusive or failed results stop without selecting a patch.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5e665c"/></marker></defs><rect width="1100" height="500" fill="#f6f5ef"/><text x="42" y="43" fill="#5e665c" font-family="monospace" font-size="11" letter-spacing="1.5">FORKSENSE / CONTROLLED EXTERNAL EXECUTION</text><g fill="none" stroke="#5e665c" stroke-width="1.5" marker-end="url(#a)"><path d="M213 139H256"/><path d="M467 139H510"/><path d="M721 139H764"/><path d="M866 178V251H612V280"/><path d="M510 330H467"/><path d="M256 330H213"/><path d="M612 280V218H362V178"/></g><g fill="#f6f5ef" stroke="#cdd1c5"><rect x="42" y="98" width="171" height="80"/><rect x="256" y="98" width="211" height="80"/><rect x="510" y="98" width="211" height="80"/><rect x="764" y="98" width="211" height="80"/><rect x="510" y="280" width="211" height="100"/><rect x="256" y="280" width="211" height="100"/><rect x="42" y="280" width="171" height="100"/></g><g fill="#242923" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle"><text x="127" y="130" font-size="16" font-weight="600">Observe</text><text x="127" y="153" font-size="11" fill="#5e665c">Run baseline verifier</text><text x="362" y="130" font-size="16" font-weight="600">Identify uncertainty</text><text x="362" y="153" font-size="11" fill="#5e665c">Explicit competing hypotheses</text><text x="616" y="130" font-size="16" font-weight="600">Design experiment</text><text x="616" y="153" font-size="11" fill="#5e665c">Policy ranks information / cost</text><text x="869" y="130" font-size="16" font-weight="600">Fork and execute</text><text x="869" y="153" font-size="11" fill="#5e665c">Bounded probe in a worktree</text><text x="616" y="312" font-size="16" font-weight="600">Update evidence</text><text x="616" y="337" font-size="11" fill="#5e665c">Observe outcome; revise weights</text><text x="616" y="357" font-size="11" fill="#5e665c">Stop probing when warranted</text><text x="362" y="312" font-size="16" font-weight="600">Repair and verify</text><text x="362" y="337" font-size="11" fill="#5e665c">Agent edits allowed source paths</text><text x="362" y="357" font-size="11" fill="#5e665c">Fresh worktree, original tests</text><text x="127" y="312" font-size="16" font-weight="600">Return evidence</text><text x="127" y="337" font-size="11" fill="#5e665c">Verified candidate patch</text><text x="127" y="357" font-size="11" fill="#5e665c">Explicit acceptance required</text></g><text x="366" y="235" fill="#5e665c" font-family="monospace" font-size="10" text-anchor="middle">MORE INFORMATIVE + AFFORDABLE? REPEAT</text><path d="M42 418H1058" stroke="#cdd1c5"/><text x="42" y="449" fill="#5e665c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">No verified candidate, no selected patch. Active branch stays unchanged until explicit acceptance.</text><text x="42" y="471" fill="#5e665c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Worktrees isolate file changes. They are not a security sandbox; execution is for trusted local repositories.</text></svg>
