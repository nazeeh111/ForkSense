<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">FORKSENSE. Stop guessing. Test the alternatives.</title><desc id="desc">An experimental fork divides one uncertain observation into two testable alternatives, then connects the evidence to a verified patch.</desc><rect width="1280" height="420" fill="#f6f5ef"/><path d="M58 63H1222M58 358H1222" stroke="#cdd1c5"/><text x="58" y="100" fill="#5e665c" font-family="monospace" font-size="11" letter-spacing="2">EXPERIMENTS FOR CODING AGENTS</text><g transform="translate(58 148)" stroke="#b44831" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="#f6f5ef"><path d="M12 75V50C12 36 40 43 40 24V5M40 24C40 43 68 36 68 50V75"/><circle cx="40" cy="5" r="6"/><circle cx="12" cy="75" r="6"/><circle cx="68" cy="75" r="6"/></g><text x="162" y="213" fill="#242923" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="64" font-weight="700" letter-spacing="-3">FORKSENSE</text><text x="58" y="294" fill="#242923" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="31" letter-spacing="-.7">Stop guessing. Test the alternatives.</text><text x="59" y="328" fill="#5e665c" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Probe competing causes. Repair with evidence. Verify independently.</text><g transform="translate(840 113)" fill="none" stroke-width="2"><path d="M0 99H42C65 99 65 24 90 24H242M42 99C65 99 65 174 90 174H142" stroke="#cdd1c5"/><path d="M242 24H277V99H309" stroke="#31614a"/><circle cx="0" cy="99" r="6" fill="#f6f5ef" stroke="#242923"/><circle cx="142" cy="174" r="6" fill="#f6f5ef" stroke="#b44831"/><circle cx="242" cy="24" r="6" fill="#f6f5ef" stroke="#31614a"/><path d="M303 94L310 99L303 104" stroke="#31614a"/></g><g fill="#5e665c" font-family="monospace" font-size="10"><text x="841" y="190">OBSERVE</text><text x="938" y="120">PROBE</text><text x="953" y="312">REJECT</text><text x="1116" y="244">VERIFY</text></g></svg>
